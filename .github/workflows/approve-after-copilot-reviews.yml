name: Approve after Copilot reviews

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    # A full commit sha of agent-knowledge main, never a branch: a merge there must not change this repo's approvals.
    uses: workguard/agent-knowledge/.github/workflows/approve-after-copilot-reviews.yml@1d5ab6d82e3677730d81ce19a29d964843902c6a
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) }}
